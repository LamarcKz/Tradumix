# O app Tradumix: liga o núcleo (crates/nucleo) às telas em React (src/).
[package]
name = "tradumix"
version = "0.1.0"
description = "Aplica traduções de jogos de PS2 na sua ISO, preservando o hash do RetroAchievements."
license = "MIT"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
nucleo = { path = "../crates/nucleo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
