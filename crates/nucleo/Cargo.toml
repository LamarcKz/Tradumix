[package]
name = "nucleo"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Núcleo do Tradumix: leitura de ISO, identidade do jogo, pacotes de tradução e aplicação do patch."

[dependencies]
thiserror = "2"
base64 = "0.22"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
md-5 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
