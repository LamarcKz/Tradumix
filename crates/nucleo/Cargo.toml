[package]
name = "nucleo"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Núcleo do Tradumix: leitura de ISO, identidade do jogo, pacotes de tradução e aplicação do patch."

[dependencies]
thiserror = "2"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
md-5 = "0.10"
