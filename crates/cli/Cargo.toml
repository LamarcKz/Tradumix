[package]
name = "tradumix-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Linha de comando do Tradumix: valida, identifica, instala e remove traduções e gera a prévia das telas."

[[bin]]
name = "tradumix-cli"
path = "src/main.rs"

[dependencies]
nucleo = { path = "../nucleo" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
